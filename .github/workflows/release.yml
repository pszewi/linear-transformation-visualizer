# Builds the desktop app for macOS (universal: Apple Silicon + Intel) and Windows and attaches
# the installers to a draft GitHub Release named after the version in src-tauri/tauri.conf.json.
# Run it from the Actions tab ("Run workflow") or by pushing a tag like v2.0.0.
name: Release desktop app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Linear Transformation Visualizer v__VERSION__
          releaseBody: |
            Unsigned builds (see the README for first-launch steps).
            macOS: download the .dmg (universal: Apple Silicon and Intel).
            Windows: download the -setup.exe (or the .msi).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
