[package]
name = "linear-transformation-visualizer"
version = "2.0.0"
description = "Interactive visualizer for linear transformations"
edition = "2021"
publish = false

[lib]
name = "ltv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
